backend:
  name: github
  repo: VugasDev/portfolio
  branch: main
  base_url: https://vugas.de
  auth_endpoint: api/auth

# Kein editorial_workflow: CMS-Speicherungen committen direkt nach main.
# Sichtbarkeit steuert allein das Frontmatter-Feld `draft` (Astro-Filter).
# Der Review-Schritt ist durch den blogpost-Skill-Push mit draft:true abgebildet.

# Zweisprachigkeit (Blog, Guides, Projekte): Deutsch in <slug>.md, Englisch daneben in <slug>.en.md.
# Blog/Guides: Die englische Fassung geht nur live, wenn sie selbst UND die deutsche veröffentlicht sind.
# Projekte: Ein Projekt ohne englische Datei fehlt auf /en/projects (ein Test schlägt dann an).
i18n:
  structure: multiple_files
  locales: [de, en]
  default_locale: de
  omit_default_locale_from_file_path: true

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    i18n: true
    # Chronologisch nach Veröffentlichungsdatum (neueste oben). commit_date bleibt
    # wählbar ("zuletzt bearbeitet"), taugt aber nicht als Standard: rückdatierte
    # Beiträge landen sonst oben, und ohne Commit-Metadaten fällt Sveltia auf alphabetisch zurück.
    summary: "{{date | date('YYYY-MM-DD')}} · {{draft | ternary('ENTWURF · ', '')}}{{title}}"
    sortable_fields:
      fields: [date, title, commit_date]
      default: { field: date, direction: descending }
    view_filters:
      - { label: Entwürfe,        field: draft, pattern: true }
      - { label: Veröffentlicht,  field: draft, pattern: false }
    fields:
      - { name: title,       label: Titel,          widget: string, i18n: true }
      - { name: description, label: Beschreibung,   widget: string, i18n: true }
      - { name: date,        label: Datum,           widget: datetime, format: "YYYY-MM-DD", i18n: duplicate }
      - { name: tags,        label: Tags,            widget: list, default: [], i18n: duplicate }
      - { name: draft,       label: Entwurf,         widget: boolean, default: false, i18n: true }
      - { name: body,        label: Inhalt,          widget: markdown, i18n: true }

  - name: guides
    label: Guides
    folder: src/content/guides
    create: true
    slug: "{{slug}}"
    extension: md
    i18n: true
    # Chronologisch nach Veröffentlichungsdatum (neueste oben). commit_date bleibt
    # wählbar ("zuletzt bearbeitet"), taugt aber nicht als Standard: rückdatierte
    # Beiträge landen sonst oben, und ohne Commit-Metadaten fällt Sveltia auf alphabetisch zurück.
    summary: "{{date | date('YYYY-MM-DD')}} · {{draft | ternary('ENTWURF · ', '')}}{{title}}"
    sortable_fields:
      fields: [date, title, commit_date]
      default: { field: date, direction: descending }
    view_filters:
      - { label: Entwürfe,        field: draft, pattern: true }
      - { label: Veröffentlicht,  field: draft, pattern: false }
    fields:
      - { name: title,       label: Titel,           widget: string, i18n: true }
      - { name: description, label: Beschreibung,    widget: string, i18n: true }
      - { name: date,        label: Datum,            widget: datetime, format: "YYYY-MM-DD", i18n: duplicate }
      - name: difficulty
        label: Schwierigkeitsgrad
        widget: select
        options: [Einsteiger, Fortgeschritten, Experte]
        i18n: duplicate
      - { name: tags,        label: Tags,            widget: list, default: [], i18n: duplicate }
      - { name: series,      label: "Serie (optional)", widget: string, required: false, i18n: true }
      - { name: order,       label: "Kapitel-Nr",    widget: number, required: false, i18n: duplicate }
      - { name: draft,       label: Entwurf,         widget: boolean, default: false, i18n: true }
      - { name: body,        label: Inhalt,          widget: markdown, i18n: true }

  - name: projects
    label: Projekte
    folder: src/content/projects
    create: true
    extension: md
    format: frontmatter
    i18n: true
    sortable_fields:
      fields: [commit_date, name]
      default: { field: commit_date, direction: descending }
    fields:
      - { name: name,        label: Name,            widget: string, i18n: true }
      - { name: description, label: Beschreibung,    widget: string, i18n: true }
      - { name: details,     label: Details (Hover-Overlay), widget: text, required: false, i18n: true }
      - { name: tags,        label: Tags,            widget: list, i18n: duplicate }
      - name: status
        label: Status
        widget: select
        options: [aktiv, "in Arbeit", Planung, archiviert]
        i18n: duplicate
      - { name: github,      label: GitHub URL,      widget: string, required: false, i18n: duplicate }
      - { name: url,         label: Live URL,        widget: string, required: false, i18n: duplicate }
      - { name: body,        label: Detailseiten-Text (optional), widget: markdown, required: false, i18n: true }
